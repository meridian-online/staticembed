name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The DuckDB the SQL tests load the artifact into. The artifact declares a
  # v1.2.0 stable-ABI floor, so it is expected to load on anything from 1.2 up;
  # this is the version the gate actually exercises.
  DUCKDB_VERSION: v1.5.5

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            duckdb_asset: duckdb_cli-linux-amd64.zip
          - os: macos-latest
            duckdb_asset: duckdb_cli-osx-arm64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Downloaded from the official release rather than a third-party setup
      # action: one fewer thing in the supply chain, and the version is visible
      # in this file.
      - name: Install the DuckDB CLI
        run: |
          set -euo pipefail
          curl -fsSL -o duckdb_cli.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/${{ matrix.duckdb_asset }}"
          unzip -o duckdb_cli.zip -d "${HOME}/.local/bin"
          chmod +x "${HOME}/.local/bin/duckdb"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Report the toolchain under test
        run: |
          rustc --version
          cargo --version
          duckdb --version
          duckdb -init /dev/null -noheader -csv -c "SELECT platform FROM pragma_platform();"

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The model, the cache and the embedding contract. No DuckDB involved:
      # staticembed-core links none of it.
      - name: Rust tests
        run: cargo test --workspace

      - name: Build and package the extension
        run: make extension

      # AC2's other half. The self-test runs first so a checker that has stopped
      # matching anything is caught before its clean report is believed.
      - name: Nothing in the artifact can open a socket
        run: |
          python3 scripts/check_no_network_deps.py --self-test
          python3 scripts/check_no_network_deps.py --artifact build/staticembed.duckdb_extension

      # LOAD the packaged artifact into a real DuckDB and query it.
      - name: SQL tests
        run: python3 scripts/run_sql_tests.py --extension build/staticembed.duckdb_extension

      - name: Report the artifact size
        run: ls -l build/staticembed.duckdb_extension
