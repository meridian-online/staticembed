## The DuckDB community-extensions registry entry for staticembed.
##
## This file is the submission: it is copied to `extensions/staticembed/description.yml`
## in duckdb/community-extensions. Merging it there makes DuckDB's CI build this
## repository at `repo.ref` for every platform in the matrix and publish the
## binaries, after which `INSTALL staticembed FROM community` works for anyone.
##
## `repo.ref` MUST BE REPOINTED before this is submitted. It has to name a commit
## that carries the build contract in `Makefile` and the `extension-ci-tools`
## submodule, and the value below does not — it is the tip of `main` as it stood
## when this entry was written. `scripts/check_description_examples.py` asserts
## only that the ref is a full 40-character SHA, because a check that the commit
## carries the contract would go quiet in any clone that no longer has the
## object, which is the shape of check this repository keeps deleting.
##
## `build:` and `language:` are labels for the extension's page — the registry's
## `scripts/build.py` reads neither. The recipe that actually runs is `make
## configure_ci`, `make release`, `make test_release` at this repository's root.

extension:
  name: staticembed
  description: Static text embeddings as a DuckDB scalar — a vector per row from a model bundled in the binary, with no API key and no network call
  version: 0.1.0
  language: Rust
  build: cargo
  license: MIT
  # wasm: the artifact is a native cdylib and the bundled weights alone are 30 MB.
  # musl and windows_arm64 are opt-in in the distribution matrix and are not
  # opted into. windows_amd64_mingw is excluded; windows_amd64 (MSVC) is not.
  excluded_platforms: "wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;linux_arm64_musl;windows_amd64_mingw"
  # python3 backs the metadata-stamp venv the C-API build contract uses.
  requires_toolchains: "rust;python3"
  maintainers:
    - hughcameron

repo:
  github: meridian-online/staticembed
  ref: 1105eb38f6ebf6d95f7efdc5b4ddc60d79e303e4

docs:
  hello_world: |
    -- A vector for a string, from a model compiled into this binary. No API
    -- key, no network call, no per-row bill.
    CREATE TABLE corpus (id INTEGER, description VARCHAR);
    INSERT INTO corpus VALUES
        (1, 'a maker of industrial fasteners'),
        (2, 'a regional freight forwarder'),
        (3, 'a foundry casting valve bodies'),
        (4, 'a chain of hardware stores');

    -- 256 floats per row, for this model.
    SELECT id, len(embed(description)) AS width FROM corpus ORDER BY id;

    -- embed is a scalar, so it composes with WHERE and LIMIT: embed a filtered
    -- subset rather than a whole table.
    SELECT id, embed(description) AS v
    FROM corpus
    WHERE description LIKE '%valve%';

    -- Long text is cut before the mean is taken, and the vector that comes back
    -- is full width and unit norm either way — nothing about it says content was
    -- dropped. Ask, rather than counting tokens.
    SELECT count(*) AS truncated_rows
    FROM corpus
    WHERE embed_is_truncated(description);

    -- Which build, which model, which width.
    SELECT staticembed_version();

  extended_description: |
    `staticembed` turns a string into a vector inside DuckDB, using a
    [Model2Vec](https://github.com/MinishLab/model2vec) static embedding model
    compiled into the extension binary. There is no API key to configure, no
    network call at query time, and no per-row cost.

    Every other route to an embedding inside DuckDB is either a transformer
    forward pass or a call to a hosted provider. Over a large text column the
    first is slow enough that people leave SQL to do it, and the second is an
    invoice you find out about afterwards. A static embedding is neither: it is a
    token lookup and a mean, so it is bounded, local and free at the margin.

    Being a scalar is the point. `embed` composes with `WHERE` and `LIMIT`, so a
    filtered subset of a table can be embedded without materialising the rest,
    and it behaves the same over a local Parquet file as over a remote one.

    ## What it is not

    **This is not a drop-in replacement for a hosted transformer, and the
    difference is measured rather than hedged.** A static embedding has no
    contextual attention. A two-dimensional map built from these vectors recovers
    most of the cluster structure a hosted transformer recovers — the regions of
    the map mean something. What it does not preserve is which specific rows sit
    next to which: only a minority of any point's nearest neighbours survive the
    swap.

    It also does not read word order. A Model2Vec vector is the mean of its token
    vectors, so `embed('valve bodies')` and `embed('bodies valve')` are the same
    vector. Repetition does count — a word twice pulls the mean toward it — but
    any phrase and its shuffle land in the same place.

    ```sql
    SELECT embed('valve bodies') = embed('bodies valve') AS order_is_ignored;
    ```

    So this is built for looking at the shape of a corpus, and it is not built for
    "show me the rows most like this one". There is deliberately no similarity or
    nearest-neighbour function here. If nearest-neighbour lookup is what you need,
    this is the wrong tool, and we would rather say so here than have you find out
    from your results.

    ## The SQL surface

    Five functions, and `embed` is the one you came for.

    | function | returns | what it is for |
    |---|---|---|
    | `embed(text VARCHAR)` | `FLOAT[]` | the vector for one string |
    | `embed_is_truncated(text VARCHAR)` | `BOOLEAN` | whether `embed(text)` had to drop content to fit |
    | `staticembed_version()` | `VARCHAR` | which build, which model, which vector width |
    | `staticembed_cache_stats()` | `STRUCT(hits, misses, encoded, uncached, entries, capacity)` | what the cache has been doing |
    | `staticembed_cache_clear()` | `BIGINT` | drop the cached vectors; returns how many |

    ### NULL, and text with nothing in it

    `embed(NULL)` is `NULL`. Text that tokenises to nothing — the empty string,
    whitespace, a string of characters the vocabulary does not carry — is a **zero
    vector of full width**, because the mean over zero tokens is zero. The two are
    different on purpose: a missing value is not the same as a value that carries
    no signal, and only one of them should disappear from a `WHERE ... IS NOT NULL`.

    ```sql
    SELECT embed(NULL) IS NULL              AS null_stays_null,
           list_sum(embed('')) = 0.0        AS empty_is_a_zero_vector,
           len(embed(''))                   AS still_full_width;
    ```

    If you want the single behaviour a text pipeline usually gives you, ask for it:

    ```sql
    SELECT embed(coalesce(description, '')) FROM corpus;
    ```

    ### A long text is truncated before the mean, and nothing about the vector says so

    `embed` builds its vector from at most **512 tokens**, and from a bounded
    number of characters before that — just over three thousand for this model.
    Anything past either is dropped before the mean, not down-weighted, and the
    vector that comes back is full width and unit norm either way. Two rows whose
    descriptions agree up to the cut and then diverge completely embed to the same
    place, and nothing about the result tells you that happened.

    Which limit bites first is a property of the text. For URLs, camelCase or
    snake_case identifiers and run-together compound words the character cut lands
    while the token count is still nowhere near 512; a line of Korean is two or
    three tokens per character and reaches the token cap in a few hundred
    characters. You do not need to reason about which case you are in:

    ```sql
    SELECT embed_is_truncated(repeat('a very long description of a valve foundry ', 500)) AS long_text_is_truncated,
           embed_is_truncated('a foundry casting valve bodies')                           AS short_text_is_not,
           embed_is_truncated(repeat(' ', 5000))                                          AS whitespace_lost_nothing;
    ```

    What it reports is whether `embed` pooled less of the text than the whole of it
    would have given, which is not the same question as whether the text was long.
    Five thousand spaces is `false`; so is a column of characters this vocabulary
    does not carry, however far past the character cut it runs, because the cut
    took nothing that would have reached the mean. `embed_is_truncated(NULL)` is
    `NULL`, matching `embed(NULL)`, so it drops out of a `WHERE` clause the same way.

    ### What counts as the same string

    The bundled tokenizer lowercases, strips accents and ignores surrounding
    whitespace, so you do not have to normalise a column before embedding it. Word
    order still matters, and different words still give different vectors.

    ```sql
    SELECT embed('Steel') = embed('  steel  ')          AS case_and_space_fold,
           embed('café')  = embed('cafe' || chr(769))   AS accents_fold;
    ```

    The cache keys on the exact input bytes rather than on the tokenizer's folded
    form, so those variants do occupy separate cache entries. That is deliberate:
    reproducing a dependency's normalisation in the cache would mean a tokenizer
    bump quietly changing which inputs share an entry, and the failure would be a
    vector returned for text nobody embedded.

    ### Repeating a query does not re-embed, up to a stated number of distinct values

    Vectors are cached against the exact input bytes and a digest of the bundled
    model's own files, so re-running a query re-embeds nothing — **for as many
    distinct values as the cache holds** — and a future build with different
    weights cannot serve you the old ones.

    ```sql
    SELECT staticembed_cache_clear();
    CREATE TABLE v AS SELECT embed(description) FROM corpus;
    SELECT staticembed_cache_stats().encoded AS encoded_first_pass,
           staticembed_cache_stats().uncached AS turned_away;

    CREATE TABLE w AS SELECT embed(description) FROM corpus;
    SELECT staticembed_cache_stats().encoded AS encoded_after_a_repeat;
    ```

    **The bound.** The cache spends a fixed memory budget — 64 MiB — so it holds
    `capacity` vectors and no more. Once it is full it **stops admitting new values
    rather than evicting old ones**, and `uncached` counts every lookup it turned
    away. `staticembed_cache_stats().capacity` is the only place to read the
    figure: it depends on the model's vector width and on how your platform's
    allocator rounds, which the extension measures at startup rather than assuming.

    ```sql
    SELECT staticembed_cache_stats().capacity > 0 AS capacity_is_measured;
    ```

    A column with more distinct values than `capacity` is served for `capacity` of
    them on a re-run and re-embeds the rest — a hit rate of `capacity / distinct`,
    holding steady as the column grows. Under any recency-ordered policy instead —
    LRU, FIFO, or two generations — a repeated scan evicts every value exactly
    before it is next wanted and the hit rate is **zero**, which is a cliff rather
    than a slope. What the choice costs is adaptivity: the values kept are the ones
    seen first in the session, so if you move on to a different column the cache
    stays full of the old one. `SELECT staticembed_cache_clear();` empties it, and
    a non-zero `uncached` is the sign that it is time.

    ## The model

    `minishlab/potion-base-8M`, a Model2Vec static embedding model, taken from its
    published release at a pinned revision and compiled into the binary. Because
    the weights ship inside the extension, the download is larger than most —
    around 30 MB compressed — and in exchange there is nothing to fetch, configure
    or pay for at query time.

    The model's publisher declares it MIT in its model card. The upstream
    repository carries no `LICENSE` file at the pinned revision, so no MIT text or
    copyright line for the model is reproduced with it; if you need the licence in
    hand rather than declared, take it up with the publisher before redistributing
    the weights. The extension's own code is MIT.

    Source, checksums and the revision the weights came from are in
    [`models/potion-base-8M/SOURCE.md`](https://github.com/meridian-online/staticembed/blob/main/models/potion-base-8M/SOURCE.md).
